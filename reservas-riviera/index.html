<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservas Riviera Maya</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="encabezado">
    <h1>Reservas Riviera Maya</h1>
    <p>Selecciona y calcula tu experiencia turística</p>
  </header>

  <main class="contenedor">
    <!-- Mensajes/Notificaciones dentro de la página (Reto 6) -->
    <div id="mensajeNotificacion" class="notificacion oculta" role="alert"></div>

    <section class="controles" aria-label="Controles del catálogo">
      <input id="buscador" type="search" placeholder="Buscar experiencia...">
      
      <select id="filtroCategoria">
        <option value="todas">Todas las categorías</option>
        <option value="naturaleza">Naturaleza</option>
        <option value="cultura">Cultura</option>
        <option value="aventura">Aventura</option>
        <option value="gastronomia">Gastronomía</option>
        <option value="bienestar">Bienestar</option>
      </select>

      <select id="ordenPrecio">
        <option value="normal">Orden original</option>
        <option value="ascendente">Menor precio</option>
        <option value="descendente">Mayor precio</option>
      </select>

      <!-- Filtro de precio máximo (Reto 2) -->
      <div class="control-precio">
        <label for="filtroPrecioMax">Precio máx: $<span id="valPrecioMax">2000</span> MXN</label>
        <input id="filtroPrecioMax" type="range" min="100" max="2000" step="50" value="2000">
      </div>
    </section>

    <p id="estado" class="estado">Cargando experiencias...</p>

    <section id="catalogo" class="catalogo"></section>

    <section class="resumen">
      <div class="encabezado-resumen">
        <h2>Mi reservación</h2>
        <button id="btnVaciar" class="btn-vaciar">Vaciar reservación</button>
      </div>
      
      <div id="listaReservas">
        <p>No hay experiencias seleccionadas.</p>
      </div>

      <!-- Resumen del total de personas e importe total (Reto 4) -->
      <div class="totales">
        <p class="total-personas">Total personas: <span id="totalPersonas">0</span></p>
        <p class="total">Total: <span id="total">$0 MXN</span></p>
      </div>
    </section>
  </main>

  <footer>
    <p>Proyecto académico de frontend</p>
  </footer>
</body>
</html>
